</a>
</div>

<div class="buttons-grid">
    <div class="btn-contact hover-pos">
        <img src="cvgcontact/Rectangle 262.svg" class="btn-icon" alt="phone">
        +7 (812) 252-05-33
    </div>
    
    <div class="btn-contact hover-neg">
        <img src="cvgcontact/Group 15.svg" class="btn-icon" alt="tg">
        @tokyosub
    </div>
    
    <div class="btn-contact hover-pos">
        <img src="cvgcontact/Vector 606 (Stroke).svg" class="btn-icon" alt="nick">
        tokyosub25
    </div>

    <div class="btn-contact hover-neg">
        <img src="cvgcontact/Vector.svg" class="btn-icon" alt="vk">
        tokyosub
    </div>
    
    <div class="btn-contact hover-pos">
        <img src="cvgcontact/Subtract.svg" class="btn-icon" alt="mail">
        tokyosub@gmail.com
    </div>
    
    <div class="btn-contact hover-neg">
        <img src="cvgcontact/Group 12.svg" class="btn-icon" alt="icon">
        @tokyosub
    </div>
</div>
<img src="star/13.svg" class="st sc1" alt="star">
<img src="star/14.svg" class="st sc2" alt="star">
<img src="star/16.svg" class="st sc3" alt="star">
<img src="star/17.svg" class="st sc4" alt="star">

<footer class="main-footer">
    <img src="images/line-green.png" class="footer-wave" alt="line">
    <div class="footer-row">
        <div class="footer-group">
            <button class="footer-circle-btn heart-btn align-left">
                <span class="icon-wrap">
                    <img src="images/heart.png" alt="heart" class="icon-base">
                    <img src="images/heart-pink.png" alt="heart" class="icon-active">
                </span>
            </button>
            
            <button class="footer-circle-btn share-btn align-left">
                <span class="icon-wrap">
                    <img src="images/share.png" alt="share" class="icon-base">
        
                    <div class="mini-icons-box">
                        <img src="images/icon1.png" alt="tg" class="mini-icon">
                        <img src="images/icon2.png" alt="email" class="mini-icon"> 
                    </div>
                </span>
            </button>
        </div>
        
        <div class="footer-group">
             <a href="decora.html" class="footer-circle-btn arrow-btn align-left">
                <span class="icon-wrap">
                    <img src="images/arrow-left.png" alt="prev" class="icon-base">
                    <img src="images/arrow-left-green.png" alt="prev" class="icon-active">
                </span>
            </button>
            
            <a href="youtube.html" class="footer-circle-btn arrow-btn align-right">
                <span class="icon-wrap">
                    <img src="images/arrow-right.png" alt="next" class="icon-base">
                    <img src="images/arrow-right-green.png" alt="next" class="icon-active">
                </span>
            </a>
        </div>
    </div>
</footer>
<script>
    const toggleButtons = document.querySelectorAll('.heart-btn, .share-btn');

    toggleButtons.forEach(btn => {
        btn.addEventListener('click', function() {
            this.classList.toggle('active');
        });
    });
</script>
